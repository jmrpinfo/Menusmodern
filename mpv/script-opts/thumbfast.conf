# Socket path (leave empty for auto)
socket=

# Thumbnail path (leave empty for auto)
thumbnail=

# Maximum thumbnail generation size in pixels (scaled down to fit)
max_height=200
max_width=200

# Scale factor for thumbnail display size (requires mpv 0.38+)
scale_factor=1

# Apply tone-mapping, no to disable
tone_mapping=auto

# Overlay id
overlay_id=42

# Create the helper only when a thumbnail is actually requested
spawn_first=no

# Stop the helper after 30 seconds without thumbnail requests
quit_after_inactivity=30

# Recreate a helper that stops returning fresh frames after a seek
watchdog_timeout=3
watchdog_retries=2

# Also refresh a surviving helper when previews resume after a pause
restart_after_idle=15

# Enable on network playback
network=no

# Enable on audio playback
audio=no

# Enable hardware decoding
hwdec=no

# Windows only: use native Windows API to write to pipe (requires LuaJIT)
direct_io=yes

# Custom path to the mpv executable
mpv_path=mpv
